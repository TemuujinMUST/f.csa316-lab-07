name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout — репозиторийн кодыг татах
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup — Node.js орчин тохируулах
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install — хамаарал суулгах
      - name: Install dependencies
        run: npm install

      # 4. Test — тест ажиллуулах
      - name: Run tests
        run: npm test
